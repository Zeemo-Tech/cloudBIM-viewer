server {
    listen 80;
    server_name localhost;

    # 使用 Docker 内置 DNS 解析器 (动态解析，避免因 backend 未就绪导致 Nginx 启动崩溃)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8090";

    # 1. 前端静态页面托管 (SPA 路由支持)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 前端静态打包文件 (JS/CSS/图片/字体直接由 Nginx 本地托管，优先于后端的 /assets API 匹配)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. Tus 大文件上传流式反向代理
    location ^~ /uploads {
        proxy_pass $backend;
        proxy_http_version 1.1;

        # 仅上传链路关闭缓冲，避免影响大量小瓦片的正常代理效率。
        proxy_request_buffering off;
        proxy_buffering         off;
        client_max_body_size    0;

        proxy_connect_timeout   120s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. 后端 API 与鉴权资源。3D 资源的 private 缓存头、ETag、Range
    # 由后端统一生成，Nginx 不得覆盖为 public。
    location ~ ^/(auth|assets|scans|alignments|mesh|health) {
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_connect_timeout   120s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
