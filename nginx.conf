server {
    listen 80;
    server_name localhost;

    # 使用 Docker 内置 DNS 解析器 (动态解析，避免因 backend 未就绪导致 Nginx 启动崩溃)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "http://backend:8090";

    # 1. 前端静态页面托管 (SPA 路由支持)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 前端静态打包文件 (JS/CSS/图片/字体直接由 Nginx 本地托管，优先于后端的 /assets API 匹配)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. 静态 3D 模型文件 (后端生成的 GLB / 3D Tiles 瓦片缓存)
    location ~* \.(glb|b3dm|pnts|cmpt)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. 后端 API 与 Tus 大文件上传流式反向代理
    location ~ ^/(auth|uploads|assets|scans|alignments|mesh|health) {
        proxy_pass $backend;
        proxy_http_version 1.1;

        # 核心：关闭请求与响应缓冲，保障 Tus 分片流式直传
        proxy_request_buffering off;
        proxy_buffering         off;
        client_max_body_size    0;

        proxy_connect_timeout   120s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
