services:
  postgres:
    platform: linux/amd64
    image: hub.macb.cc/library/postgres:18-alpine
    environment:
      POSTGRES_DB: cloudbim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: AuS4tpYfwNSu
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # PostgreSQL 18 stores data under a major-version directory below this mount.
      - cloudbim-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudbim"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mesh-service:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADDR: :8090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: AuS4tpYfwNSu
      DB_NAME: cloudbim
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-cloudbim-dev-secret}
      REGISTER_CODE: ${REGISTER_CODE:-laochen}
      CLOUDBIM_SEED_DEMO: ${CLOUDBIM_SEED_DEMO:-true}
      IFC_BUNDLE_BIN: /opt/tools/ifc_bundle/ifc_bundle
      GOCESIUMTILER_BIN: /opt/tools/gocesiumtiler/gocesiumtiler-lin-x64
      MESH_SERVICE_URL: ${MESH_SERVICE_URL:-http://mesh-service:8001}
      MESH_SERVICE_STORAGE_DIR: ${MESH_SERVICE_STORAGE_DIR:-/storage}
      PATH: /opt/tools/ifc_bundle:/opt/tools/gocesiumtiler:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /opt/tools/ifc_bundle
      PROJ_LIB: /opt/tools/gocesiumtiler/share
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
    ports:
      - "8090:8090"
    restart: unless-stopped
    volumes:
      - cloudbim-data:/app/data
      - ${ZHONGJIAN_BACK_DIR:-../../zhongjian-back}/tools/ifc_bundle:/opt/tools/ifc_bundle:ro
      - ${ZHONGJIAN_BACK_DIR:-../../zhongjian-back}/tools/gocesiumtiler:/opt/tools/gocesiumtiler:ro

  mesh-service:
    platform: linux/amd64
    build:
      context: ${ZHONGJIAN_BACK_DIR:-../../zhongjian-back}/services/mesh-service
      dockerfile_inline: |
        FROM hub.macb.cc/library/python:3.11-slim

        RUN apt-get update && apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libgomp1 \
            libcom-err2 \
            libp11-kit0 \
            libx11-6 \
            libxrender1 \
            libxext6 \
            && rm -rf /var/lib/apt/lists/*

        WORKDIR /app

        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt

        COPY . .

        # Keep the event loop responsive while PyMeshLab performs CPU-bound work.
        RUN sed -i 's/^async def remesh(/def remesh(/' main.py

        EXPOSE 8001

        CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PORT: 8001
    expose:
      - "8001"
    volumes:
      - cloudbim-data:/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 90s
    restart: unless-stopped

volumes:
  cloudbim-db:
  cloudbim-data:
