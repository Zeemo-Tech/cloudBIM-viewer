services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudbim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudbim}
      POSTGRES_USER: ${DB_USER:-cloudbim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudbim123456}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cloudbim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cloudbim} -d ${DB_NAME:-cloudbim}"]
      interval: 3s
      timeout: 3s
      retries: 10

  mesh-service:
    build:
      context: ../services/mesh-service
      dockerfile: Dockerfile
    image: cloudbim-mesh-service:latest
    container_name: cloudbim-mesh-service
    restart: unless-stopped
    environment:
      PORT: 8001
      TZ: Asia/Shanghai
      C2M_OUTPUT_GID: ${CLOUDBIM_RUNTIME_GID:-1000}
    ports:
      - "127.0.0.1:${MESH_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./data:/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/algorithms\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cloudbim-pgdata:
