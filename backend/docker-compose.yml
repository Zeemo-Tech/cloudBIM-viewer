services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudbim-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mesh-service:
        condition: service_started
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADDR: :8090
      CLOUDBIM_DATA_DIR: /app/data
      CLOUDBIM_SEED_DEMO: ${CLOUDBIM_SEED_DEMO:-true}
      # The checked-in backend/.env is for the host-side MySQL setup. The
      # running Compose stack uses PostgreSQL, so keep these values explicit
      # for the container service instead of inheriting that unrelated file.
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: AuS4tpYfwNSu
      DB_NAME: cloudbim
      DB_SSLMODE: disable
      JWT_SECRET: cloudbim-local-development-secret-change-me
      REGISTER_CODE: laochen
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MESH_SERVICE_URL: http://mesh-service:8001
      GOCESIUMTILER_BIN: /opt/tools/gocesiumtiler/gocesiumtiler-lin-x64
      IFC_BUNDLE_BIN: /opt/tools/ifc_bundle/ifc_bundle
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-2}
      UPLOAD_CHUNK_LIMIT: ${UPLOAD_CHUNK_LIMIT:-67108864}
      UPLOAD_FILE_LIMIT: ${UPLOAD_FILE_LIMIT:-107374182400}
    ports:
      - "${BACKEND_PORT:-8090}:8090"
    volumes:
      - cloudbim-data:/app/data
      - ${CLOUDBIM_GOCESIUMTILER_DIR:-/Users/monica/Desktop/zhongjian-back/tools/gocesiumtiler}:/opt/tools/gocesiumtiler:ro
      - ${CLOUDBIM_IFC_BUNDLE_DIR:-/Users/monica/Desktop/zhongjian-back/tools/ifc_bundle}:/opt/tools/ifc_bundle:ro

  postgres:
    image: postgres:16-alpine
    container_name: cloudbim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudbim}
      POSTGRES_USER: ${DB_USER:-cloudbim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudbim123456}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cloudbim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cloudbim} -d ${DB_NAME:-cloudbim}"]
      interval: 3s
      timeout: 3s
      retries: 10

  mesh-service:
    build:
      context: ../services/mesh-service
      dockerfile: Dockerfile
    image: cloudbim-mesh-service:latest
    container_name: cloudbim-mesh-service
    restart: unless-stopped
    environment:
      PORT: 8001
      TZ: Asia/Shanghai
      C2M_OUTPUT_GID: ${CLOUDBIM_RUNTIME_GID:-1000}
      C2M_MAX_UNDOWNSAMPLED_POINTS: ${C2M_MAX_UNDOWNSAMPLED_POINTS:-5000000}
      ARTIFACT_OUTPUT_GID: ${CLOUDBIM_RUNTIME_GID:-1000}
    ports:
      - "127.0.0.1:${MESH_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./data:/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/algorithms\")'"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cloudbim-pgdata:
  cloudbim-data:
