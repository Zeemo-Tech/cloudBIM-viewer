name: cloudbim

services:
  postgres:
    image: ${POSTGRES_IMAGE:-hub.macb.cc/library/postgres:18-alpine}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudbim}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      - cloudbim-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  mesh-service:
    image: ${MESH_IMAGE:-cloudbim-mesh-service:latest}
    platform: linux/amd64
    build:
      context: ./services/mesh-service
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    restart: unless-stopped
    environment:
      PORT: 8001
      TZ: ${TZ:-Asia/Shanghai}
      C2M_OUTPUT_GID: ${CLOUDBIM_RUNTIME_GID:-1000}
      C2M_MAX_UNDOWNSAMPLED_POINTS: ${C2M_MAX_UNDOWNSAMPLED_POINTS:-5000000}
      ARTIFACT_OUTPUT_GID: ${CLOUDBIM_RUNTIME_GID:-1000}
      REBAR_MEMORY_CACHE_MB: ${REBAR_MEMORY_CACHE_MB:-4096}
      REBAR_SPATIAL_WORKERS: ${REBAR_SPATIAL_WORKERS:-4}
    ports:
      - "127.0.0.1:${MESH_SERVICE_PORT:-8001}:8001"
    volumes:
      - ./backend/data:/storage
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/algorithms\")'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  backend:
    # The checked-in IFC/LAS converters are Linux x86_64 binaries.
    platform: linux/amd64
    image: ${BACKEND_IMAGE:-cloudbim-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
      platforms:
        - linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mesh-service:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADDR: :8090
      CLOUDBIM_DATA_DIR: /app/data
      CLOUDBIM_SEED_DEMO: ${CLOUDBIM_SEED_DEMO:-true}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-cloudbim}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-720h}
      REGISTER_CODE: ${REGISTER_CODE:-laochen}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MESH_SERVICE_URL: http://mesh-service:8001
      GOCESIUMTILER_BIN: /opt/tools/gocesiumtiler/gocesiumtiler-lin-x64
      IFC_BUNDLE_BIN: /opt/tools/ifc_bundle/ifc_bundle
      PROCESSING_WORKERS: ${PROCESSING_WORKERS:-2}
      UPLOAD_CHUNK_LIMIT: ${UPLOAD_CHUNK_LIMIT:-67108864}
      UPLOAD_FILE_LIMIT: ${UPLOAD_FILE_LIMIT:-107374182400}
    ports:
      - "${BACKEND_PORT:-8090}:8090"
    volumes:
      - cloudbim-data:/app/data
      - ${CLOUDBIM_GOCESIUMTILER_DIR:?Set CLOUDBIM_GOCESIUMTILER_DIR in .env}:/opt/tools/gocesiumtiler:ro
      - ${CLOUDBIM_IFC_BUNDLE_DIR:?Set CLOUDBIM_IFC_BUNDLE_DIR in .env}:/opt/tools/ifc_bundle:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090; printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; timeout 3 grep -q \"database.*ready\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  cloudbim-db:
    name: ${CLOUDBIM_DB_VOLUME:-backend_cloudbim-db}
  cloudbim-data:
    name: ${CLOUDBIM_DATA_VOLUME:-backend_cloudbim-data}
